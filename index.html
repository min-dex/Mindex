    <script>
      (() => {
        const fallbackVersion = "20260926-1808";
        const modules = [
          "mindex.constants.js", "mindex.design-tokens.js", "mindex.worship-model.js",
          "mindex.worship-persistence.js", "mindex.presenter.js", "mindex.worship-input.js",
          "mindex.presenter-ui.js", "mindex.worship-week.js", "mindex.setlist-links.js",
          "mindex.manuals.js", "mindex.bulletin.js", "mindex.worship-source.js", "app.js",
          "mindex.db-refresh.js", "mindex.monitor.js",
        ];
        const styles = [
          "styles.css", "styles.presenter-output.css", "styles.bulletin.css",
          "styles.calendar.css", "styles.monitor.css",
        ];
        const load = (path, version) => new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = `./${path}?v=${encodeURIComponent(version)}`;
          script.onload = resolve;
          script.onerror = () => reject(new Error(`${path}을 불러오지 못했습니다.`));
          document.body.append(script);
        });
        const loadStyle = (path, version) => new Promise((resolve, reject) => {
          const stylesheet = document.createElement("link");
          stylesheet.rel = "stylesheet";
          stylesheet.href = `./${path}?v=${encodeURIComponent(version)}`;
          stylesheet.onload = resolve;
          stylesheet.onerror = () => reject(new Error(`${path}을 불러오지 못했습니다.`));
          document.head.append(stylesheet);
        });
        const resolveVersion = async () => {
          try {
            const response = await fetch(`./mindex-release.json?t=${Date.now()}`, { cache: "no-store" });
            const release = await response.json();
            return /^[0-9A-Za-z._-]{4,80}$/.test(String(release?.version || "")) ? release.version : fallbackVersion;
          } catch {
            return fallbackVersion;
          }
        };
        void (async () => {
          const version = await resolveVersion();
          window.MINDEX_RELEASE = version;
          void Promise.all(styles.map((style) => loadStyle(style, version))).catch((error) => console.error(error));
          for (const module of modules) await load(module, version);
        })();
      })();
    </script>
